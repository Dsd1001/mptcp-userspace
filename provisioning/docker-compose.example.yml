services:
  mpx-provision:
    build:
      context: ..
      dockerfile: provisioning/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:8088"
    environment:
      MPX_PROVISION_ADMIN_USER: admin
      MPX_PROVISION_ADMIN_PASSWORD: ${MPX_PROVISION_ADMIN_PASSWORD:?Set a long random administrator password}
      MPX_PROVISION_PUBLIC_BASE_URL: https://config.example.com
    volumes:
      - provisioning-data:/data
volumes:
  provisioning-data:
