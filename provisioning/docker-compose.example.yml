services:
  mpx-provision:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:8088"
    environment:
      MPX_PROVISION_ADMIN_USER: admin
      MPX_PROVISION_ADMIN_PASSWORD: change-this-to-a-long-random-password
      MPX_PROVISION_PUBLIC_BASE_URL: https://config.example.com
    volumes:
      - ./data:/data
