<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MPX Provisioning</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f5f5f7;color:#1d1d1f}main{max-width:1180px;margin:32px auto;padding:0 20px}.card{background:white;border:1px solid #ddd;border-radius:14px;padding:18px;margin-bottom:16px}h1{margin:0 0 6px}h2{margin:0 0 14px;font-size:19px}.muted{color:#666;font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}label{font-size:13px;color:#555;display:block;margin-bottom:4px}input,select{box-sizing:border-box;width:100%;padding:9px 10px;border:1px solid #c8c8cc;border-radius:8px;font:inherit}button{padding:9px 12px;border:1px solid #bbb;border-radius:8px;background:#fff;cursor:pointer}button.primary{background:#1d1d1f;color:#fff;border-color:#1d1d1f}button.danger{color:#b42318}.profiles{display:flex;gap:8px;flex-wrap:wrap}.profiles button.active{font-weight:700;border-color:#333}.relay{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:8px;margin:8px 0;align-items:end}.url{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}.status{min-height:20px;margin-top:8px;font-size:13px}.checks{display:flex;gap:18px;align-items:center}.checks label{display:flex;gap:7px;align-items:center;margin:0}.checks input{width:auto}@media(max-width:760px){.grid,.relay{grid-template-columns:1fr}.relay button{width:100%}}
</style></head><body><main>
<div class="card"><h1>MPX Provisioning</h1><div class="muted">在这里维护 MPTCP Desk 的完整运行配置。每份配置生成一个随机 API URL，Mac 只需要保存这条 URL。</div></div>
<div class="card"><div class="row"><button class="primary" id="new">新建配置</button><div id="profiles" class="profiles"></div></div></div>
<div class="card"><h2>客户端配置</h2><div class="grid">
<div><label>显示名称</label><input id="name" placeholder="例如 HKBN 5-Line"></div>
<div><label>传输模式</label><select id="mode"><option value="userspace_multipath">Userspace Multipath / MPX/4</option><option value="native_mptcp">Native MPTCP</option></select></div>
<div><label>本地监听端口</label><input id="listen" type="number" value="1081" min="1024" max="65535"></div>
<div><label>Scheduler</label><select id="scheduler"><option value="auto">Auto</option><option value="aggregate">Aggregate</option><option value="protect">Protect</option><option value="weighted">Weighted</option></select></div>
</div><div class="checks" style="margin-top:14px"><label><input id="tcp" type="checkbox" checked>TCP</label><label><input id="udp" type="checkbox" checked>UDP</label><label><input id="resident" type="checkbox">后台常驻</label></div>
<div style="margin-top:14px"><label>Transport Key（64 位十六进制）</label><div class="row"><input id="key" class="url" style="flex:1" autocomplete="off"><button id="genkey">生成 Key</button></div></div>
</div>
<div class="card"><div class="row"><h2 style="flex:1;margin:0">Relay 路径</h2><button id="addrelay">添加 Relay</button></div><div id="relays"></div></div>
<div class="card"><h2>发放链接</h2><div class="row"><input id="apiurl" class="url" readonly style="flex:1" placeholder="保存配置后生成"><button id="copy">复制 URL</button><button id="rotate">轮换 URL</button></div><div class="muted" style="margin-top:8px">URL 中包含随机高熵 token，本身就是客户端访问凭据。轮换后旧 URL 立即失效。</div></div>
<div class="card"><div class="row"><button class="primary" id="save">保存配置</button><button class="danger" id="delete">删除配置</button></div><div id="status" class="status"></div></div>
</main><script>
let items=[], current=null;
const $=id=>document.getElementById(id); const status=s=>{$('status').textContent=s||''};
function blank(){return {id:null,name:'',api_url:'',config:{mode:'userspace_multipath',listen_port:1081,scheduler_mode:'auto',tcp_enabled:true,udp_enabled:true,background_resident:false,transport_key:'',relays:[{host:'',port:8849,download_mbps:null,upload_mbps:null},{host:'',port:8849,download_mbps:null,upload_mbps:null}]}}}
function renderList(){const p=$('profiles');p.innerHTML='';items.forEach(x=>{const b=document.createElement('button');b.textContent=x.name||x.id;b.className=current&&current.id===x.id?'active':'';b.onclick=()=>{current=x;fill(x);renderList()};p.appendChild(b)})}
function relayRow(r,i){const d=document.createElement('div');d.className='relay';d.innerHTML=`<div><label>IPv4</label><input data-k="host"></div><div><label>端口</label><input data-k="port" type="number"></div><div><label>下行 Mbps</label><input data-k="download_mbps" type="number" step="0.1"></div><div><label>上行 Mbps</label><input data-k="upload_mbps" type="number" step="0.1"></div><button>删除</button>`;for(const inp of d.querySelectorAll('input')){const k=inp.dataset.k;inp.value=r[k]??'';inp.oninput=()=>{let v=inp.value;if(k==='port')v=Number(v);if(k.endsWith('_mbps'))v=v===''?null:Number(v);current.config.relays[i][k]=v}}d.querySelector('button').onclick=()=>{if(current.config.relays.length<=2)return;current.config.relays.splice(i,1);renderRelays()};return d}
function renderRelays(){const box=$('relays');box.innerHTML='';current.config.relays.forEach((r,i)=>box.appendChild(relayRow(r,i)))}
function fill(x){current=JSON.parse(JSON.stringify(x));$('name').value=current.name||'';$('mode').value=current.config.mode;$('listen').value=current.config.listen_port;$('scheduler').value=current.config.scheduler_mode||'auto';$('tcp').checked=current.config.tcp_enabled;$('udp').checked=current.config.udp_enabled;$('resident').checked=!!current.config.background_resident;$('key').value=current.config.transport_key||'';$('apiurl').value=current.api_url||'';renderRelays();modeState();status('')}
function collect(){current.name=$('name').value.trim();current.config.mode=$('mode').value;current.config.listen_port=Number($('listen').value);current.config.scheduler_mode=$('scheduler').value;current.config.tcp_enabled=$('tcp').checked;current.config.udp_enabled=$('udp').checked;current.config.background_resident=$('resident').checked;current.config.transport_key=$('key').value.trim();return {name:current.name,config:current.config}}
function modeState(){const native=$('mode').value==='native_mptcp';$('scheduler').disabled=native;$('key').disabled=native;if(native){$('tcp').checked=true;$('tcp').disabled=true}else $('tcp').disabled=false}
async function request(url,opt={}){const r=await fetch(url,{cache:'no-store',...opt});if(!r.ok)throw new Error((await r.text()).trim()||`HTTP ${r.status}`);if(r.status===204)return null;return r.json()}
async function load(){try{items=await request('/admin/api/profiles');renderList();if(items.length){fill(items[0])}else fill(blank())}catch(e){status(e.message)}}
$('new').onclick=()=>{fill(blank());renderList()};$('mode').onchange=modeState;$('addrelay').onclick=()=>{if(current.config.relays.length<8){current.config.relays.push({host:'',port:8849,download_mbps:null,upload_mbps:null});renderRelays()}};
$('genkey').onclick=()=>{const b=new Uint8Array(32);crypto.getRandomValues(b);$('key').value=[...b].map(x=>x.toString(16).padStart(2,'0')).join('')};
$('copy').onclick=async()=>{if($('apiurl').value){await navigator.clipboard.writeText($('apiurl').value);status('API URL 已复制')}};
$('save').onclick=async()=>{try{const body=JSON.stringify(collect());let saved;if(current.id)saved=await request('/admin/api/profiles/'+current.id,{method:'PUT',headers:{'Content-Type':'application/json'},body});else saved=await request('/admin/api/profiles',{method:'POST',headers:{'Content-Type':'application/json'},body});const idx=items.findIndex(x=>x.id===saved.id);if(idx>=0)items[idx]=saved;else items.push(saved);fill(saved);renderList();status('已保存，Revision '+saved.revision)}catch(e){status('保存失败：'+e.message)}};
$('rotate').onclick=async()=>{if(!current.id)return; if(!confirm('轮换后旧 API URL 会立即失效，继续？'))return;try{const saved=await request('/admin/api/profiles/'+current.id+'/rotate',{method:'POST'});items[items.findIndex(x=>x.id===saved.id)]=saved;fill(saved);renderList();status('API URL 已轮换')}catch(e){status(e.message)}};
$('delete').onclick=async()=>{if(!current.id)return;if(!confirm('确定删除这份配置？对应 API URL 会立即失效。'))return;try{await request('/admin/api/profiles/'+current.id,{method:'DELETE'});items=items.filter(x=>x.id!==current.id);renderList();items.length?fill(items[0]):fill(blank());status('已删除')}catch(e){status(e.message)}};
load();
</script></body></html>
